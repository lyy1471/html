const DATA = {"en": {"label": "English", "title": "Privacy Policy", "updated": "Last updated: August 2026", "sections": [{"h": "1. Information We Collect", "p": "HanziPath stores your learning data locally on your device, including vocabulary progress, quiz results, and personal settings. We do not collect, transmit, or store any personal information on external servers.\n\nIn addition, when you use the in-app feedback feature, the text you write and any optional contact information you provide are sent to our server so that we can read and respond to your feedback."}, {"h": "2. How We Use Information", "p": "Local data is used solely to power the app's spaced repetition learning system, track your progress, and personalize your experience. No data is used for advertising or marketing purposes."}, {"h": "3. Data Storage", "p": "All user data is stored locally on your device using SQLite. You can delete all stored data at any time by using the \"Reset Progress\" option in the Profile screen."}, {"h": "4. Third-Party Services", "p": "HanziPath uses the following third-party services:\n• Google Text-to-Speech (TTS): Used for Chinese pronunciation playback. Data is processed by Google according to their privacy policy.\n• Flutter framework: Provided by Google.\n• Feedback service: when you submit feedback, your message and optional contact details are transmitted over HTTPS to our server   and stored so that we can review and reply to your feedback."}, {"h": "5. Minors' Privacy", "p": "This app does not collect personal information from minors, nor does it knowingly collect any personal information from minors."}, {"h": "6. Changes to This Policy", "p": "We may update this privacy policy from time to time. Any changes will be reflected in the app with an updated revision date."}, {"h": "7. Contact", "p": "If you have questions about this privacy policy, please contact us through the app store listing or our support email. You can also email us at super_soft@outlook.com. }, {"h": "2. 情報の利用方法", "p": "ローカルデータは、アプリの間隔反復学習システムの動作、進捗の追跡、体験のパーソナライズにのみ使用されます。広告やマーケティング目的でデータが使用されることはありません。"}, {"h": "3. データの保存", "p": "すべてのユーザーデータは SQLite を使用して端末にローカル保存されます。プロフィール画面の「進捗をリセット」オプションから、いつでも保存されたすべてのデータを削除できます。"}, {"h": "4. サードパーティサービス", "p": "HanziPathは以下のサードパーティサービスを使用しています：\n• Google Text-to-Speech (TTS)：中国語の発音再生に使用。データは Google のプライバシーポリシーに従って処理されます。\n• Flutter framework：Google が提供。\n• フィードバックサービス：フィードバック送信時、メッセージと任意の連絡先は HTTPS 経由で当社サーバー（nteam.cloud）へ送信・保存され、確認と返信にのみ使用されます。"}, {"h": "5. 未成年者のプライバシー", "p": "本アプリは、未成年者を対象とした個人情報の収集は行わず、未成年者の個人情報を意図的に収集することもありません。"}, {"h": "6. ポリシーの変更", "p": "本プライバシーポリシーは随時更新される場合があります。変更がある場合は、更新された改訂日とともにアプリ内に反映されます。"}, {"h": "7. お問い合わせ", "p": "本プライバシーポリシーについてご質問がある場合は、アプリストアのリストまたはサポートメールよりお問い合わせください。また、super_soft@outlook.com までメールでお問い合わせいただけます。"}]}, "ko": {"label": "한국어", "title": "개인정보 처리방침", "updated": "최종 업데이트: 2026년 8월", "sections": [{"h": "1. 수집하는 정보", "p": "HanziPath는 어휘 진행 상황, 퀴즈 결과, 개인 설정을 포함한 학습 데이터를 기기에 로컬로 저장합니다. 외부 서버에서 개인정보를 수집, 전송 또는 저장하지 않습니다.\n\n또한 앱 내 피드백 기능을 사용하시면, 작성하신 내용과 선택 입력한 연락처가 피드백을 확인하고 회신하기 위해 저희 서버로 전송됩니다."}, {"h": "2. 정보 사용 방법", "p": "로컬 데이터는 앱의 간격 반복 학습 시스템 구동, 진행 상황 추적, 경험 맞춤화에만 사용됩니다. 어떤 데이터도 광고나 마케팅 목적으로 사용되지 않습니다."}, {"h": "3. 데이터 저장", "p": "모든 사용자 데이터는 SQLite를 사용하여 기기에 로컬로 저장됩니다. 프로필 화면의 \"진행 상황 초기화\" 옵션을 사용하여 언제든지 저장된 모든 데이터를 삭제할 수 있습니다."}, {"h": "4. 타사 서비스", "p": "HanziPath는 다음 타사 서비스를 사용합니다:\n• Google Text-to-Speech (TTS): 중국어 발음 재생에 사용됩니다. 데이터는 Google의 개인정보 처리방침에 따라 처리됩니다.\n• Flutter framework: Google이 제공합니다.\n• 피드백 서비스: 피드백 제출 시 메시지와 선택 입력한 연락처가 HTTPS를 통해 저희 서버 로 전송·저장되며, 확인 및 회신에만 사용됩니다."}, {"h": "5. 미성년자 개인정보 보호", "p": "본 앱은 미성년자를 대상으로 개인정보를 수집하지 않으며, 미성년자의 개인정보를 고의로 수집하지도 않습니다."}, {"h": "6. 정책 변경", "p": "본 개인정보 처리방침은 수시로 업데이트될 수 있습니다. 변경 사항은 업데이트된 개정일과 함께 앱에 반영됩니다."}, {"h": "7. 연락처", "p": "본 개인정보 처리방침에 대해 궁금한 점이 있으시면 앱 스토어 목록이나 지원 이메일을 통해 문의해 주세요.또한 super_soft@outlook.com 으로 이메일 문의하실 수 있습니다."}]}, "es": {"label": "Español", "title": "Política de privacidad", "updated": "Última actualización: agosto de 2026", "sections": [{"h": "1. Información que recopilamos", "p": "HanziPath almacena tus datos de aprendizaje localmente en tu dispositivo, incluyendo el progreso del vocabulario, los resultados de las pruebas y la configuración personal. No recopilamos, transmitimos ni almacenamos información personal en servidores externos.\n\nAdemás, cuando utilizas la función de comentarios de la app, el texto que escribes y cualquier dato de contacto opcional se envían a nuestro servidor para que podamos leer y responder a tus comentarios."}, {"h": "2. Cómo usamos la información", "p": "Los datos locales se utilizan únicamente para alimentar el sistema de aprendizaje de repetición espaciada de la app, seguir tu progreso y personalizar tu experiencia. Ningún dato se utiliza con fines publicitarios o de marketing."}, {"h": "3. Almacenamiento de datos", "p": "Todos los datos del usuario se almacenan localmente en tu dispositivo usando SQLite. Puedes eliminar todos los datos almacenados en cualquier momento usando la opción \"Reiniciar progreso\" en la pantalla de Perfil."}, {"h": "4. Servicios de terceros", "p": "HanziPath utiliza los siguientes servicios de terceros:\n• Google Text-to-Speech (TTS): Usado para la reproducción de pronunciación en chino. Los datos son procesados por Google según su política de privacidad.\n• Flutter framework: Proporcionado por Google.\n• Servicio de comentarios: al enviar un comentario, tu mensaje y los datos de contacto opcionales se transmiten por HTTPS a nuestro servidor   y se almacenan para revisarlos y responder."}, {"h": "5. Privacidad de los menores", "p": "Esta aplicación no recopila información personal dirigida a menores, ni recopila deliberadamente datos personales de menores de edad."}, {"h": "6. Cambios en esta política", "p": "Podemos actualizar esta política de privacidad de vez en cuando. Cualquier cambio se reflejará en la app con una fecha de revisión actualizada."}, {"h": "7. Contacto", "p": "Si tienes preguntas sobre esta política de privacidad, contáctanos a través de la lista de la tienda de aplicaciones o nuestro correo de soporte. También puedes escribirnos a super_soft@outlook.com."}]}, "fr": {"label": "Français", "title": "Politique de confidentialité", "updated": "Dernière mise à jour : août 2026", "sections": [{"h": "1. Informations que nous collectons", "p": "HanziPath stocke vos données d'apprentissage localement sur votre appareil, y compris la progression du vocabulaire, les résultats des quiz et les paramètres personnels. Nous ne collectons, ne transmettons et ne stockons aucune information personnelle sur des serveurs externes.\n\nPar ailleurs, lorsque vous utilisez la fonction de commentaires intégrée, le texte que vous rédigez et vos coordonnées facultatives sont envoyés à notre serveur afin que nous puissions lire votre avis et y répondre."}, {"h": "2. Comment nous utilisons les informations", "p": "Les données locales sont utilisées uniquement pour alimenter le système d'apprentissage par répétition espacée de l'application, suivre votre progression et personnaliser votre expérience. Aucune donnée n'est utilisée à des fins publicitaires ou marketing."}, {"h": "3. Stockage des données", "p": "Toutes les données utilisateur sont stockées localement sur votre appareil à l'aide de SQLite. Vous pouvez supprimer toutes les données stockées à tout moment en utilisant l'option « Réinitialiser la progression » dans l'écran Profil."}, {"h": "4. Services tiers", "p": "HanziPath utilise les services tiers suivants :\n• Google Text-to-Speech (TTS) : utilisé pour la lecture de la prononciation chinoise. Les données sont traitées par Google conformément à sa politique de confidentialité.\n• Flutter framework : fourni par Google.\n• Service de commentaires : lors de l’envoi, votre message et vos coordonnées facultatives sont transmis par HTTPS à notre serveur   et stockés aux fins de lecture et de réponse."}, {"h": "5. Confidentialité des mineurs", "p": "Cette application ne collecte pas d'informations personnelles ciblant les mineurs et ne recueille pas délibérément d'informations personnelles les concernant."}, {"h": "6. Modifications de cette politique", "p": "Nous pouvons mettre à jour cette politique de confidentialité de temps à autre. Toute modification sera reflétée dans l'application avec une date de révision mise à jour."}, {"h": "7. Contact", "p": "Si vous avez des questions concernant cette politique de confidentialité, veuillez nous contacter via la liste du magasin d'applications ou notre e-mail de support. Vous pouvez également nous écrire à super_soft@outlook.com."}]}, "de": {"label": "Deutsch", "title": "Datenschutzerklärung", "updated": "Zuletzt aktualisiert: August 2026", "sections": [{"h": "1. Informationen, die wir sammeln", "p": "HanziPath speichert deine Lerndaten lokal auf deinem Gerät, einschließlich Vokabelfortschritt, Quiz-Ergebnisse und persönliche Einstellungen. Wir sammeln, übertragen oder speichern keine persönlichen Informationen auf externen Servern.\n\nDarüber hinaus werden beim Nutzen der Feedback-Funktion der von dir geschriebene Text und optional angegebene Kontaktdaten an unseren Server gesendet, damit wir dein Feedback lesen und darauf antworten können."}, {"h": "2. Wie wir Informationen verwenden", "p": "Lokale Daten werden ausschließlich verwendet, um das Wiederholungslernsystem der App zu betreiben, deinen Fortschritt zu verfolgen und deine Erfahrung zu personalisieren. Es werden keine Daten für Werbe- oder Marketingzwecke verwendet."}, {"h": "3. Datenspeicherung", "p": "Alle Benutzerdaten werden lokal auf deinem Gerät mit SQLite gespeichert. Du kannst alle gespeicherten Daten jederzeit über die Option \"Fortschritt zurücksetzen\" im Profil-Bildschirm löschen."}, {"h": "4. Drittanbieter-Dienste", "p": "HanziPath verwendet die folgenden Drittanbieter-Dienste:\n• Google Text-to-Speech (TTS): Wird für die Wiedergabe chinesischer Aussprache verwendet. Daten werden von Google gemäß deren Datenschutzerklärung verarbeitet.\n• Flutter framework: Bereitgestellt von Google.\n• Feedback-Dienst: Beim Absenden werden deine Nachricht und optionale Kontaktdaten per HTTPS an unseren Server   übertragen und gespeichert, ausschließlich zum Lesen und Beantworten."}, {"h": "5. Datenschutz für Minderjährige", "p": "Diese App erhebt keine personenbezogenen Daten von Minderjährigen und sammelt nicht absichtlich personenbezogene Daten Minderjähriger."}, {"h": "6. Änderungen dieser Richtlinie", "p": "Wir können diese Datenschutzerklärung von Zeit zu Zeit aktualisieren. Alle Änderungen werden mit einem aktualisierten Revisionsdatum in der App angezeigt."}, {"h": "7. Kontakt", "p": "Wenn du Fragen zu dieser Datenschutzerklärung hast, kontaktiere uns bitte über den App-Store-Eintrag oder unsere Support-E-Mail. Du kannst uns auch per E-Mail an super_soft@outlook.com erreichen."}]}, "ru": {"label": "Русский", "title": "Политика конфиденциальности", "updated": "Последнее обновление: август 2026", "sections": [{"h": "1. Информация, которую мы собираем", "p": "HanziPath хранит ваши данные об обучении локально на вашем устройстве, включая прогресс в словаре, результаты тестов и личные настройки. Мы не собираем, не передаём и не храним личную информацию на внешних серверах.\n\nКроме того, при использовании встроенной функции обратной связи написанный вами текст и необязательные контактные данные отправляются на наш сервер, чтобы мы могли прочитать ваш отзыв и ответить."}, {"h": "2. Как мы используем информацию", "p": "Локальные данные используются исключительно для работы системы интервального повторения приложения, отслеживания вашего прогресса и персонализации опыта. Никакие данные не используются в рекламных или маркетинговых целях."}, {"h": "3. Хранение данных", "p": "Все пользовательские данные хранятся локально на вашем устройстве с использованием SQLite. Вы можете удалить все сохранённые данные в любой момент, используя опцию «Сбросить прогресс» на экране Профиля."}, {"h": "4. Сторонние сервисы", "p": "HanziPath использует следующие сторонние сервисы:\n• Google Text-to-Speech (TTS): используется для воспроизведения китайского произношения. Данные обрабатываются Google в соответствии с их политикой конфиденциальности.\n• Flutter framework: предоставляется Google.\n• Служба обратной связи: при отправке отзыва ваше сообщение и необязательные контактные данные передаются по HTTPS на наш сервер   и сохраняются только для просмотра и ответа."}, {"h": "5. Конфиденциальность несовершеннолетних", "p": "Это приложение не собирает персональные данные, ориентированные на несовершеннолетних, и не намеренно собирает их персональные данные."}, {"h": "6. Изменения в этой политике", "p": "Мы можем периодически обновлять эту политику конфиденциальности. Любые изменения будут отражены в приложении с обновлённой датой редакции."}, {"h": "7. Контакт", "p": "Если у вас есть вопросы об этой политике конфиденциальности, свяжитесь с нами через страницу в магазине приложений или по электронной почте поддержки. Вы также можете написать нам на super_soft@outlook.com."}]}, "pt": {"label": "Português", "title": "Política de Privacidade", "updated": "Última atualização: agosto de 2026", "sections": [{"h": "1. Informações que coletamos", "p": "HanziPath armazena seus dados de aprendizado localmente no seu dispositivo, incluindo o progresso do vocabulário, resultados dos quizzes e configurações pessoais. Não coletamos, transmitimos ou armazenamos informações pessoais em servidores externos.\n\nAlém disso, ao usar o recurso de comentários do app, o texto que você escreve e qualquer informação de contato opcional são enviados ao nosso servidor para que possamos ler e responder aos seus comentários."}, {"h": "2. Como usamos as informações", "p": "Os dados locais são usados exclusivamente para alimentar o sistema de repetição espaçada do aplicativo, acompanhar seu progresso e personalizar sua experiência. Nenhum dado é usado para fins publicitários ou de marketing."}, {"h": "3. Armazenamento de dados", "p": "Todos os dados do usuário são armazenados localmente no seu dispositivo usando SQLite. Você pode excluir todos os dados armazenados a qualquer momento usando a opção \"Redefinir Progresso\" na tela de Perfil."}, {"h": "4. Serviços de terceiros", "p": "HanziPath usa os seguintes serviços de terceiros:\n• Google Text-to-Speech (TTS): Usado para a reprodução da pronúncia em chinês. Os dados são processados pelo Google de acordo com a política de privacidade deles.\n• Flutter framework: Fornecido pelo Google.\n• Serviço de comentários: ao enviar um comentário, sua mensagem e os dados de contato opcionais são transmitidos por HTTPS ao nosso servidor   e armazenados para leitura e resposta."}, {"h": "5. Privacidade de menores", "p": "Este aplicativo não coleta informações pessoais direcionadas a menores de idade, nem coleta deliberadamente dados pessoais de menores."}, {"h": "6. Alterações nesta política", "p": "Podemos atualizar esta política de privacidade de tempos em tempos. Quaisquer alterações serão refletidas no aplicativo com uma data de revisão atualizada."}, {"h": "7. Contato", "p": "Se você tiver dúvidas sobre esta política de privacidade, entre em contato conosco através da listagem da loja de aplicativos ou do nosso e-mail de suporte. Você também pode nos enviar um e-mail para super_soft@outlook.com."}]}, "vi": {"label": "Tiếng Việt", "title": "Chính sách bảo mật", "updated": "Cập nhật lần cuối: tháng 8 năm 2026", "sections": [{"h": "1. Thông tin chúng tôi thu thập", "p": "HanziPath lưu trữ dữ liệu học tập của bạn cục bộ trên thiết bị, bao gồm tiến độ từ vựng, kết quả bài kiểm tra và cài đặt cá nhân. Chúng tôi không thu thập, truyền hoặc lưu trữ bất kỳ thông tin cá nhân nào trên máy chủ bên ngoài.\n\nNgoài ra, khi bạn sử dụng tính năng phản hồi trong ứng dụng, nội dung bạn viết và thông tin liên hệ tùy chọn sẽ được gửi đến máy chủ của chúng tôi để đọc và trả lời phản hồi của bạn."}, {"h": "2. Cách chúng tôi sử dụng thông tin", "p": "Dữ liệu cục bộ chỉ được sử dụng để vận hành hệ thống học tập lặp lại ngắt quãng của ứng dụng, theo dõi tiến độ và cá nhân hóa trải nghiệm của bạn. Không có dữ liệu nào được sử dụng cho mục đích quảng cáo hoặc tiếp thị."}, {"h": "3. Lưu trữ dữ liệu", "p": "Tất cả dữ liệu người dùng được lưu trữ cục bộ trên thiết bị của bạn bằng SQLite. Bạn có thể xóa tất cả dữ liệu đã lưu bất cứ lúc nào bằng tùy chọn \"Đặt lại tiến độ\" trong màn hình Hồ sơ."}, {"h": "4. Dịch vụ bên thứ ba", "p": "HanziPath sử dụng các dịch vụ bên thứ ba sau:\n• Google Text-to-Speech (TTS): Được sử dụng để phát âm phát âm tiếng Trung. Dữ liệu được Google xử lý theo chính sách quyền riêng tư của họ.\n• Flutter framework: Do Google cung cấp.\n• Dịch vụ phản hồi: khi gửi phản hồi, nội dung và thông tin liên hệ tùy chọn được truyền qua HTTPS đến máy chủ của chúng tôi   và được lưu chỉ để xem và trả lời."}, {"h": "5. Quyền riêng tư của người chưa thành niên", "p": "Ứng dụng này không thu thập thông tin cá nhân nhắm vào người chưa thành niên, cũng không cố ý thu thập thông tin cá nhân của họ."}, {"h": "6. Thay đổi đối với chính sách này", "p": "Chúng tôi có thể cập nhật chính sách quyền riêng tư này theo thời gian. Mọi thay đổi sẽ được phản ánh trong ứng dụng với ngày cập nhật mới."}, {"h": "7. Liên hệ", "p": "Nếu bạn có câu hỏi về chính sách quyền riêng tư này, vui lòng liên hệ với chúng tôi qua danh sách cửa hàng ứng dụng hoặc email hỗ trợ của chúng tôi. Bạn cũng có thể gửi email cho chúng tôi tại super_soft@outlook.com."}]}, "th": {"label": "ไทย", "title": "นโยบายความเป็นส่วนตัว", "updated": "อัปเดตล่าสุด: สิงหาคม 2026", "sections": [{"h": "1. ข้อมูลที่เราเก็บรวบรวม", "p": "HanziPath เก็บข้อมูลการเรียนรู้ของคุณไว้ในเครื่องของคุณ รวมถึงความคืบหน้าคำศัพท์ ผลแบบทดสอบ และการตั้งค่าส่วนบุคคล เราไม่เก็บรวบรวม ส่ง หรือจัดเก็บข้อมูลส่วนบุคคลใด ๆ บนเซิร์ฟเวอร์ภายนอก\n\nนอกจากนี้ เมื่อคุณใช้ฟีเจอร์ข้อเสนอแนะในแอป เนื้อหาที่คุณเขียนและข้อมูลติดต่อที่ไม่บังคับจะถูกส่งไปยังเซิร์ฟเวอร์ของเราเพื่ออ่านและตอบกลับข้อเสนอแนะของคุณ"}, {"h": "2. วิธีที่เราใช้ข้อมูล", "p": "ข้อมูลในเครื่องใช้เพื่อขับเคลื่อนระบบการเรียนรู้แบบทวนซ้ำตามช่วงเวลาของแอป ติดตามความคืบหน้า และปรับปรุงประสบการณ์ของคุณ ไม่มีข้อมูลใดถูกใช้เพื่อการโฆษณาหรือการตลาด"}, {"h": "3. การจัดเก็บข้อมูล", "p": "ข้อมูลผู้ใช้ทั้งหมดจัดเก็บไว้ในเครื่องของคุณโดยใช้ SQLite คุณสามารถลบข้อมูลที่จัดเก็บไว้ทั้งหมดได้ตลอดเวลาโดยใช้ตัวเลือก \"รีเซ็ตความคืบหน้า\" ในหน้าโปรไฟล์"}, {"h": "4. บริการของบุคคลที่สาม", "p": "HanziPath ใช้บริการของบุคคลที่สามดังต่อไปนี้:\n• Google Text-to-Speech (TTS): ใช้สำหรับการเล่นเสียงอ่านภาษาจีน ข้อมูลถูกประมวลผลโดย Google ตามนโยบายความเป็นส่วนตัวของพวกเขา\n• Flutter framework: จัดหาโดย Google\n• บริการข้อเสนอแนะ: เมื่อส่งข้อเสนอแนะ เนื้อหาและข้อมูลติดต่อที่ไม่บังคับจะถูกส่งผ่าน HTTPS ไปยังเซิร์ฟเวอร์ของเรา   และจัดเก็บไว้เพื่ออ่านและตอบกลับเท่านั้น"}, {"h": "5. ความเป็นส่วนตัวของผู้เยาว์", "p": "แอปนี้ไม่เก็บข้อมูลส่วนบุคคลที่กำหนดเป้าไปยังผู้เยาว์ และไม่จงใจเก็บข้อมูลส่วนบุคคลของผู้เยาว์"}, {"h": "6. การเปลี่ยนแปลงนโยบายนี้", "p": "เราอาจปรับปรุงนโยบายความเป็นส่วนตัวนี้เป็นครั้งคราว การเปลี่ยนแปลงใด ๆ จะปรากฏในแอปพร้อมวันที่แก้ไขที่อัปเดต"}, {"h": "7. ติดต่อ", "p": "หากคุณมีคำถามเกี่ยวกับนโยบายความเป็นส่วนตัวนี้ โปรดติดต่อเราผ่านรายการในแอปสโตร์หรืออีเมลสนับสนุนของเรา คุณยังสามารถส่งอีเมลถึงเราที่ super_soft@outlook.com"}]}, "id": {"label": "Bahasa Indonesia", "title": "Kebijakan Privasi", "updated": "Terakhir diperbarui: Agustus 2026", "sections": [{"h": "1. Informasi yang Kami Kumpulkan", "p": "HanziPath menyimpan data pembelajaran Anda secara lokal di perangkat Anda, termasuk kemajuan kosakata, hasil kuis, dan pengaturan pribadi. Kami tidak mengumpulkan, mengirimkan, atau menyimpan informasi pribadi apa pun di server eksternal.\n\nSelain itu, saat Anda menggunakan fitur masukan dalam aplikasi, teks yang Anda tulis dan informasi kontak opsional akan dikirim ke server kami agar kami dapat membaca dan menanggapi masukan Anda."}, {"h": "2. Cara Kami Menggunakan Informasi", "p": "Data lokal hanya digunakan untuk mendukung sistem pembelajaran pengulangan berjarak (spaced repetition) aplikasi, melacak kemajuan Anda, dan mempersonalisasi pengalaman Anda. Tidak ada data yang digunakan untuk tujuan periklanan atau pemasaran."}, {"h": "3. Penyimpanan Data", "p": "Semua data pengguna disimpan secara lokal di perangkat Anda menggunakan SQLite. Anda dapat menghapus semua data yang tersimpan kapan saja dengan menggunakan opsi \"Reset Kemajuan\" di layar Profil."}, {"h": "4. Layanan Pihak Ketiga", "p": "HanziPath menggunakan layanan pihak ketiga berikut:\n• Google Text-to-Speech (TTS): Digunakan untuk memutar pengucapan bahasa Mandarin. Data diproses oleh Google sesuai dengan kebijakan privasi mereka.\n• Flutter framework: Disediakan oleh Google.\n• Layanan masukan: saat mengirim masukan, pesan Anda dan kontak opsional dikirim melalui HTTPS ke server kami   dan disimpan hanya untuk dibaca dan dibalas."}, {"h": "5. Privasi Anak di Bawah Umur", "p": "Aplikasi ini tidak mengumpulkan informasi pribadi yang menargetkan anak di bawah umur, dan tidak sengaja mengumpulkan informasi pribadi mereka."}, {"h": "6. Perubahan pada Kebijakan Ini", "p": "Kami dapat memperbarui kebijakan privasi ini dari waktu ke waktu. Setiap perubahan akan ditampilkan dalam aplikasi dengan tanggal revisi yang diperbarui."}, {"h": "7. Kontak", "p": "Jika Anda memiliki pertanyaan mengenai kebijakan privasi ini, silakan hubungi kami melalui halaman aplikasi di toko aplikasi atau email dukungan kami. Anda juga dapat mengirim email kepada kami di super_soft@outlook.com."}]}, "it": {"label": "Italiano", "title": "Informativa sulla privacy", "updated": "Ultimo aggiornamento: agosto 2026", "sections": [{"h": "1. Informazioni che raccogliamo", "p": "HanziPath memorizza i tuoi dati di apprendimento localmente sul tuo dispositivo, inclusi i progressi nel vocabolario, i risultati dei quiz e le impostazioni personali. Non raccogliamo, trasmettiamo né memorizziamo alcuna informazione personale su server esterni.\n\nInoltre, quando usi la funzione di feedback nell’app, il testo che scrivi e gli eventuali dati di contatto facoltativi vengono inviati al nostro server per consentirci di leggere e rispondere al tuo feedback."}, {"h": "2. Come utilizziamo le informazioni", "p": "I dati locali vengono utilizzati esclusivamente per alimentare il sistema di apprendimento basato sulla ripetizione spaziata dell’app, monitorare i tuoi progressi e personalizzare la tua esperienza. Nessun dato viene utilizzato a fini pubblicitari o di marketing."}, {"h": "3. Archiviazione dei dati", "p": "Tutti i dati dell’utente vengono archiviati localmente sul tuo dispositivo utilizzando SQLite. È possibile eliminare tutti i dati memorizzati in qualsiasi momento utilizzando l’opzione “Ripristina progressi” nella schermata Profilo."}, {"h": "4. Servizi di terze parti", "p": "HanziPath utilizza i seguenti servizi di terze parti:\n• Google Text-to-Speech (TTS): utilizzato per la riproduzione della pronuncia cinese. I dati vengono trattati da Google in conformità con la propria informativa sulla privacy.\n• Framework Flutter: fornito da Google.\n• Servizio feedback: all’invio, il messaggio e i dati di contatto facoltativi vengono trasmessi via HTTPS al nostro server   e conservati solo per lettura e risposta."}, {"h": "5. Privacy dei minorenni", "p": "Questa app non raccoglie dati personali rivolti ai minorenni, né raccoglie deliberatamente i loro dati personali."}, {"h": "6. Modifiche alla presente informativa", "p": "Ci riserviamo il diritto di aggiornare la presente informativa sulla privacy di tanto in tanto. Eventuali modifiche saranno riportate nell’app con una data di revisione aggiornata."}, {"h": "7. Contatti", "p": "In caso di domande relative alla presente informativa sulla privacy, vi preghiamo di contattarci tramite la scheda dell’app nell’app store o tramite la nostra e-mail di assistenza. Puoi anche scriverci a super_soft@outlook.com."}]}, "nl": {"label": "Nederlands", "title": "Privacybeleid", "updated": "Laatst bijgewerkt: augustus 2026", "sections": [{"h": "1. Informatie die we verzamelen", "p": "HanziPath slaat je leergegevens lokaal op je apparaat op, waaronder voortgang met woordenschat, quizresultaten en persoonlijke instellingen. We verzamelen, verzenden of bewaren geen persoonlijke gegevens op externe servers.\n\nDaarnaast worden wanneer je de feedbackfunctie in de app gebruikt, de tekst die je schrijft en eventuele optionele contactgegevens naar onze server gestuurd, zodat we je feedback kunnen lezen en beantwoorden."}, {"h": "2. Hoe we informatie gebruiken", "p": "Lokale gegevens worden uitsluitend gebruikt om het leersysteem met gespreide herhaling van de app aan te sturen, je voortgang bij te houden en je ervaring te personaliseren. Er worden geen gegevens gebruikt voor reclame- of marketingdoeleinden."}, {"h": "3. Gegevensopslag", "p": "Alle gebruikersgegevens worden lokaal op je apparaat opgeslagen met behulp van SQLite. Je kunt alle opgeslagen gegevens op elk moment verwijderen via de optie ‘Voortgang resetten’ in het profielscherm."}, {"h": "4. Diensten van derden", "p": "HanziPath maakt gebruik van de volgende diensten van derden:\n• Google Text-to-Speech (TTS): wordt gebruikt voor het afspelen van de Chinese uitspraak. Gegevens worden door Google verwerkt in overeenstemming met hun privacybeleid.\n• Flutter-framework: geleverd door Google.\n• Feedbackdienst: bij verzending worden je bericht en optionele contactgegevens via HTTPS naar onze server   verzonden en alleen opgeslagen om te lezen en te beantwoorden."}, {"h": "5. Privacy van minderjarigen", "p": "Deze app verzamelt geen persoonlijke gegevens gericht op minderjarigen en verzamelt niet opzettelijk persoonlijke gegevens van minderjarigen."}, {"h": "6. Wijzigingen in dit beleid", "p": "We kunnen dit privacybeleid van tijd tot tijd bijwerken. Eventuele wijzigingen worden in de app weergegeven met een bijgewerkte revisiedatum."}, {"h": "7. Contact", "p": "Als u vragen hebt over dit privacybeleid, neem dan contact met ons op via de vermelding in de app store of ons e-mailadres voor ondersteuning. Je kunt ons ook e-mailen op super_soft@outlook.com."}]}, "tr": {"label": "Türkçe", "title": "Gizlilik Politikası", "updated": "Son güncelleme: Ağustos 2026", "sections": [{"h": "1. Topladığımız Bilgiler", "p": "HanziPath, kelime ilerlemeniz, test sonuçlarınız ve kişisel ayarlarınız dahil olmak üzere öğrenme verilerinizi cihazınızda yerel olarak saklar. Harici sunucularda hiçbir kişisel bilgiyi toplamayız, aktarmayız veya saklamayız.\n\nAyrıca, uygulama içi geri bildirim özelliğini kullandığınızda yazdığınız metin ve isteğe bağlı iletişim bilgileriniz, geri bildiriminizi okuyup yanıtlayabilmemiz için sunucumuza gönderilir."}, {"h": "2. Bilgileri Nasıl Kullanıyoruz", "p": "Yerel veriler, yalnızca uygulamanın aralıklı tekrar öğrenme sistemini çalıştırmak, ilerlemenizi takip etmek ve deneyiminizi kişiselleştirmek için kullanılır. Hiçbir veri reklam veya pazarlama amaçları için kullanılmaz."}, {"h": "3. Veri Depolama", "p": "Tüm kullanıcı verileri, SQLite kullanılarak cihazınızda yerel olarak depolanır. Profil ekranındaki \"İlerlemeyi Sıfırla\" seçeneğini kullanarak istediğiniz zaman depolanan tüm verileri silebilirsiniz."}, {"h": "4. Üçüncü Taraf Hizmetleri", "p": "HanziPath aşağıdaki üçüncü taraf hizmetlerini kullanır:\n• Google Metin Okuma (TTS): Çince telaffuzların seslendirilmesi için kullanılır. Veriler, Google'ın gizlilik politikasına göre işlenir.\n• Flutter çerçevesi: Google tarafından sağlanır.\n• Geri bildirim hizmeti: gönderim sırasında mesajınız ve isteğe bağlı iletişim bilgileriniz HTTPS üzerinden sunucumuza   iletilir ve yalnızca okunup yanıtlanmak üzere saklanır."}, {"h": "5. Reşit Olmayanların Gizliliği", "p": "Bu uygulama reşit olmayanlara yönelik kişisel bilgi toplamaz ve reşit olmayanların kişisel bilgilerini bilerek toplamaz."}, {"h": "6. Bu Politikadaki Değişiklikler", "p": "Bu gizlilik politikasını zaman zaman güncelleyebiliriz. Herhangi bir değişiklik, güncellenen revizyon tarihi ile birlikte uygulamada yansıtılacaktır."}, {"h": "7. İletişim", "p": "Bu gizlilik politikası hakkında sorularınız varsa, lütfen uygulama mağazası sayfası veya destek e-postamız aracılığıyla bizimle iletişime geçin. Bize super_soft@outlook.com adresinden de e-posta gönderebilirsiniz."}]}, "pl": {"label": "Polski", "title": "Polityka prywatności", "updated": "Ostatnia aktualizacja: sierpień 2026 r.", "sections": [{"h": "1. Gromadzone przez nas informacje", "p": "HanziPath przechowuje dane dotyczące nauki lokalnie na urządzeniu użytkownika, w tym postępy w nauce słownictwa, wyniki quizów i ustawienia osobiste. Nie gromadzimy, nie przesyłamy ani nie przechowujemy żadnych danych osobowych na serwerach zewnętrznych.\n\nPonadto gdy korzystasz z funkcji opinii w aplikacji, napisany przez Ciebie tekst oraz opcjonalne dane kontaktowe są wysyłane na nasz serwer, abyśmy mogli przeczytać Twoją opinię i odpowiedzieć."}, {"h": "2. Jak wykorzystujemy informacje", "p": "Dane lokalne są wykorzystywane wyłącznie do obsługi systemu nauki opartego na powtórkach rozłożonych w czasie, śledzenia postępów oraz personalizacji doświadczenia użytkownika. Żadne dane nie są wykorzystywane do celów reklamowych ani marketingowych."}, {"h": "3. Przechowywanie danych", "p": "Wszystkie dane użytkownika są przechowywane lokalnie na urządzeniu przy użyciu bazy danych SQLite. W dowolnym momencie możesz usunąć wszystkie przechowywane dane, korzystając z opcji „Resetuj postępy” na ekranie profilu."}, {"h": "4. Usługi stron trzecich", "p": "HanziPath korzysta z następujących usług stron trzecich:\n• Google Text-to-Speech (TTS): Służy do odtwarzania chińskiej wymowy. Dane są przetwarzane przez Google zgodnie z polityką prywatności tej firmy.\n• Framework Flutter: udostępniany przez Google.\n• Usługa opinii: przy wysyłaniu opinii Twoja wiadomość i opcjonalne dane kontaktowe są przesyłane przez HTTPS na nasz serwer   i przechowywane wyłącznie w celu przeczytania i odpowiedzi."}, {"h": "5. Prywatność osób niepełnoletnich", "p": "Ta aplikacja nie zbiera danych osobowych skierowanych na osoby niepełnoletnich ani nie zbiera celowo ich danych osobowych."}, {"h": "6. Zmiany w niniejszej polityce", "p": "Od czasu do czasu możemy aktualizować niniejszą politykę prywatności. Wszelkie zmiany zostaną odzwierciedlone w aplikacji wraz z zaktualizowaną datą aktualizacji."}, {"h": "7. Kontakt", "p": "W razie pytań dotyczących niniejszej polityki prywatności prosimy o kontakt za pośrednictwem strony aplikacji w sklepie z aplikacjami lub naszego adresu e-mail pomocy technicznej. Możesz też napisać do nas na adres super_soft@outlook.com."}]}, "ms": {"label": "Bahasa Melayu", "title": "Dasar Privasi", "updated": "Kemas kini terakhir: Ogos 2026", "sections": [{"h": "1. Maklumat Yang Kami Kumpul", "p": "HanziPath menyimpan data pembelajaran anda secara setempat pada peranti anda, termasuk kemajuan kosa kata, keputusan kuiz dan tetapan peribadi. Kami tidak mengumpul, menghantar atau menyimpan sebarang maklumat peribadi pada pelayan luar.\n\nSelain itu, apabila anda menggunakan ciri maklum balas dalam apl, teks yang anda tulis dan sebarang maklumat hubungan pilihan akan dihantar ke pelayan kami supaya kami dapat membaca dan membalas maklum balas anda."}, {"h": "2. Bagaimana Kami Menggunakan Maklumat", "p": "Data setempat digunakan semata-mata untuk menjalankan sistem pembelajaran ulangan berjarak, menjejak kemajuan anda dan memperibadikan pengalaman anda. Tiada data digunakan untuk tujuan pengiklanan atau pemasaran."}, {"h": "3. Penyimpanan Data", "p": "Semua data pengguna disimpan secara setempat pada peranti anda menggunakan SQLite. Anda boleh memadam semua data tersimpan pada bila-bila masa melalui pilihan \"Set Semula Kemajuan\" dalam skrin Profil."}, {"h": "4. Perkhidmatan Pihak Ketiga", "p": "HanziPath menggunakan perkhidmatan pihak ketiga berikut:\n• Google Text-to-Speech (TTS): Untuk main balik sebutan bahasa Cina. Data diproses oleh Google mengikut dasar privasi mereka.\n• Rangka kerja Flutter: Disediakan oleh Google.\n• Perkhidmatan maklum balas: semasa menghantar, mesej anda dan maklumat hubungan pilihan dihantar melalui HTTPS ke pelayan kami   dan disimpan hanya untuk dibaca dan dibalas."}, {"h": "5. Privasi Golongan Bawah Umur", "p": "Aplikasi ini tidak mengumpulkan maklumat peribadi yang menyasarkan golongan bawah umur, dan tidak sengaja mengumpulkan maklumat peribadi mereka."}, {"h": "6. Perubahan Pada Dasar Ini", "p": "Kami mungkin mengemas kini dasar privasi ini dari semasa ke semasa. Sebarang perubahan akan ditunjukkan dalam aplikasi dengan tarikh semakan yang dikemas kini."}, {"h": "7. Hubungi", "p": "Jika anda mempunyai soalan tentang dasar privasi ini, sila hubungi kami melalui penyenaraian gedung aplikasi atau e-mel sokongan kami. Anda juga boleh menghantar e-mel kepada kami di super_soft@outlook.com."}]}, "ar": {"label": "العربية", "title": "سياسة الخصوصية", "updated": "آخر تحديث: أغسطس 2026", "sections": [{"h": "1. المعلومات التي نجمعها", "p": "يخزّن HanziPath بيانات تعلّمك محليًا على جهازك، بما في ذلك تقدّم المفردات ونتائج الاختبارات والإعدادات الشخصية. نحن لا نجمع أو نرسل أو نخزّن أي معلومات شخصية على خوادم خارجية.\n\nبالإضافة إلى ذلك، عند استخدام ميزة الملاحظات داخل التطبيق، يُرسَل النص الذي تكتبه وأي معلومات اتصال اختيارية إلى خادمنا حتى نتمكن من قراءة ملاحظاتك والرد عليها."}, {"h": "2. كيف نستخدم المعلومات", "p": "تُستخدم البيانات المحلية فقط لتشغيل نظام التكرار المتباعد وتتبّع تقدّمك وتخصيص تجربتك. لا تُستخدم أي بيانات لأغراض إعلانية أو تسويقية."}, {"h": "3. تخزين البيانات", "p": "جميع بيانات المستخدم مخزّنة محليًا على جهازك باستخدام SQLite. يمكنك حذف كل البيانات المخزّنة في أي وقت عبر خيار \"إعادة تعيين التقدّم\" في شاشة الملف الشخصي."}, {"h": "4. خدمات الطرف الثالث", "p": "يستخدم HanziPath الخدمات التالية:\n• Google Text-to-Speech (TTS): لتحويل النص إلى كلام بالصينية. تُعالج البيانات من قِبل Google وفق سياسة الخصوصية الخاصة بها.\n• إطار Flutter: مقدَّم من Google.\n• خدمة الملاحظات: عند الإرسال، تُنقل رسالتك ومعلومات الاتصال الاختيارية عبر HTTPS إلى خادمنا   وتُخزَّن للقراءة والرد فقط."}, {"h": "5. خصوصية القاصرين", "p": "لا يجمع هذا التطبيق أي معلومات شخصية موجهة إلى القاصرين، كما لا يجمع عمدًا أي معلومات شخصية عنهم."}, {"h": "6. التغييرات على هذه السياسة", "p": "قد نحدّث سياسة الخصوصية من وقت لآخر. ستنعكس أي تغييرات في التطبيق مع تحديث تاريخ المراجعة."}, {"h": "7. التواصل", "p": "إذا كانت لديك أسئلة حول سياسة الخصوصية هذه، يُرجى التواصل معنا عبر صفحة التطبيق في المتجر أو بريد الدعم. يمكنك أيضًا مراسلتنا عبر البريد الإلكتروني super_soft@outlook.com."}]}};
const select = document.getElementById('lang');
Object.keys(DATA).forEach(code => {
  const o = document.createElement('option');
  o.value = code; o.textContent = DATA[code].label;
  select.appendChild(o);
});
function render(code){
  const d = DATA[code];
  document.title = 'HanziPath — ' + d.title;
  document.getElementById('title').textContent = d.title;
  document.getElementById('updated').textContent = d.updated;
  const main = document.getElementById('content');
  main.innerHTML = '';
  d.sections.forEach(s => {
    const sec = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = s.h;
    const p = document.createElement('p'); p.textContent = s.p;
    sec.append(h, p); main.append(sec);
  });
  document.documentElement.lang = code === 'zhHant' ? 'zh-Hant' : (code === 'zh' ? 'zh-Hans' : code);
  document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
  try { localStorage.setItem('hanzipath-lang', code); } catch (e) {}
  select.value = code;
}
function detect(){
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const tag of list){
    const low = String(tag).toLowerCase();
    if (low.startsWith('zh')){
      if (low.includes('hant') || /-(tw|hk|mo)\b/.test(low)) return 'zhHant';
      return 'zh';
    }
    const base = low.split('-')[0];
    if (DATA[base]) return base;
  }
  return 'en';
}
let initial = null;
try { initial = localStorage.getItem('hanzipath-lang'); } catch (e) {}
render(DATA[initial] ? initial : detect());
select.addEventListener('change', () => render(select.value));
</script>
